  --track-wide:0.14em;--track-wider:0.22em;
  --radius-chip:2px;--radius-control:3px;--radius-panel:4px;
  --hud-bracket:22px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg0);color:var(--fg);font:500 17px/1.3 var(--font-display);overflow:hidden;-webkit-user-select:none;user-select:none}
body.stack{overflow-y:auto}
#viewport{position:relative;width:100%}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;width:1600px;height:470px;padding:10px 12px}

/* header: wordmark + eyebrow + chevron rail */
.top{display:flex;align-items:center;gap:16px;height:36px;margin-bottom:8px}
.wordmark{display:inline-flex;align-items:baseline;gap:.32em;font:700 24px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.wordmark .sep{color:var(--fg-structure);font-weight:400}
.wordmark .num{font-family:var(--font-mono);color:var(--accent);letter-spacing:.04em}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font:13px var(--font-mono);letter-spacing:var(--track-wide);text-transform:uppercase;color:var(--fg-dim);white-space:nowrap}
.eyebrow::before{content:"";width:16px;height:2px;background:var(--accent)}
.rail{flex:1;height:12px;color:var(--fg-structure);min-width:40px}
.rail svg{display:block;width:100%;height:100%}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border-radius:var(--radius-chip);background:var(--bg1);box-shadow:var(--well-recess);font:12px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-dim);white-space:nowrap}
.lamp{width:9px;height:9px;border-radius:50%;background:var(--fg-structure);flex:none;transition:background .15s,box-shadow .15s}
.lamp.on{background:var(--accent);box-shadow:var(--glow-box)}
.lamp.ok{background:var(--ok);box-shadow:0 0 10px rgba(111,165,123,.6)}
button.key{font:12px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--fg);background:var(--plate);border:0;border-radius:var(--radius-control);box-shadow:var(--plate-rise);padding:7px 11px;cursor:pointer}
button.key:hover{color:var(--accent)}
button.key:active{transform:translateY(1px);box-shadow:var(--well-recess)}

/* layout */
.row{display:grid;grid-template-columns:600px 1fr 600px;gap:10px;height:406px}
.panel{position:relative;background:var(--plate);border-radius:var(--radius-panel);box-shadow:var(--plate-rise);overflow:hidden}
.panel::before{content:"";position:absolute;left:12px;right:12px;top:6px;height:4px;background:radial-gradient(circle,var(--fg-structure) 1.4px,transparent 1.8px) 0 0/22px 4px repeat-x;opacity:.7}
.hud{position:absolute;inset:16px 8px 8px 8px;border:2px solid var(--line);border-radius:var(--radius-panel);
  background:
   linear-gradient(var(--line-strong),var(--line-strong)) top left/var(--hud-bracket) 2px no-repeat,
   linear-gradient(var(--line-strong),var(--line-strong)) top left/2px var(--hud-bracket) no-repeat,
   linear-gradient(var(--line-strong),var(--line-strong)) top right/var(--hud-bracket) 2px no-repeat,
   linear-gradient(var(--line-strong),var(--line-strong)) top right/2px var(--hud-bracket) no-repeat,
   linear-gradient(var(--line-strong),var(--line-strong)) bottom left/var(--hud-bracket) 2px no-repeat,
   linear-gradient(var(--line-strong),var(--line-strong)) bottom left/2px var(--hud-bracket) no-repeat,
   linear-gradient(var(--line-strong),var(--line-strong)) bottom right/var(--hud-bracket) 2px no-repeat,
   linear-gradient(var(--line-strong),var(--line-strong)) bottom right/2px var(--hud-bracket) no-repeat,
   var(--bg1);}
.hud-label{position:absolute;top:10px;left:14px;display:inline-flex;align-items:center;gap:10px;font:13px var(--font-mono);letter-spacing:var(--track-wide);text-transform:uppercase;color:var(--fg-dim);z-index:2}
.hud-label::before{content:"";width:10px;height:2px;background:var(--accent)}
.hud-label b{color:var(--fg);font-weight:700}
.hud-readout{position:absolute;top:6px;right:12px;z-index:2}
body.stack #stage{width:624px;height:auto}
body.stack .row{grid-template-columns:600px;height:auto}
body.stack .panel{height:auto}
body.stack .hud{position:relative;inset:auto;margin:16px 8px 8px}
body.stack .top{flex-wrap:wrap;height:auto}
body.stack .rail{display:none}

/* controller drawing */
svg.padsvg{display:block;width:580px;height:346px;margin:30px 0 0 2px}
.body-shape{fill:url(#bodyGrad);stroke:#3A3E46;stroke-width:1.5}
.btn .s{fill:var(--bg1);stroke:#3A3E46;stroke-width:1.5;transition:fill .1s,stroke .1s}
.btn text{font:700 11px var(--font-mono);fill:var(--fg-structure);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.btn.bound{cursor:pointer}
.btn.bound .s{stroke:var(--fg-dim)}
.btn.bound text{fill:var(--fg)}
.btn.unb{opacity:.4}
.btn .press{transform-box:fill-box;transform-origin:center;transition:transform .07s}
.btn.down .press{transform:scale(.86)}
.btn.down .s{fill:var(--accent);stroke:var(--accent);filter:drop-shadow(0 0 6px rgba(255,230,41,.6))}
.btn.down text{fill:var(--accent-fg)}
.btn.lit .s{stroke:var(--accent);stroke-width:2.4}
.ring{fill:none;stroke:var(--accent);stroke-width:2;opacity:0;pointer-events:none;transform-box:fill-box;transform-origin:center}
.ring.go{animation:ring .55s ease-out}
@keyframes ring{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}
.knob{fill:var(--plate);stroke:var(--fg-dim);stroke-width:1.2;pointer-events:none}
.btn.down .knob,.btn.drag .knob,.btn.moving .knob{fill:var(--accent);stroke:var(--accent)}
.lead{fill:none;stroke:var(--fg-structure);stroke-width:1.4;transition:stroke .1s}
.lead.on{stroke:var(--accent);stroke-width:2}
.cdot{fill:var(--fg-structure)}
.cdot.on{fill:var(--accent)}
.call{cursor:pointer}
.call rect.cb{fill:var(--plate);stroke:var(--line);stroke-width:1;transition:fill .1s,stroke .1s}
.call .ck{font:700 11px var(--font-mono);letter-spacing:.12em;fill:var(--accent)}
.call .cm{font:10px var(--font-mono);letter-spacing:.12em;fill:var(--fg-dim)}
.call .ct{font:700 16px var(--font-display);fill:var(--fg)}
.call.on rect.cb{fill:var(--accent-soft);stroke:var(--accent)}
.call.flash rect.cb{animation:cflash .6s ease-out}
@keyframes cflash{0%{fill:rgba(255,230,41,.55)}100%{fill:var(--accent-soft)}}

/* robot panel */
.readout{position:absolute;left:22px;right:22px;top:34px;height:62px;z-index:2}
.ra{font:700 32px/1.02 var(--font-display);letter-spacing:.02em;color:var(--fg-hero);text-shadow:var(--glow);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ra.idle{color:var(--fg);text-shadow:none}
.ra.pop{animation:pop .35s cubic-bezier(0.2,1.2,0.3,1)}
@keyframes pop{0%{transform:translateY(10px);opacity:0}100%{transform:none;opacity:1}}
.rs{font:12px var(--font-mono);letter-spacing:var(--track-wide);text-transform:uppercase;color:var(--fg-dim);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs b{color:var(--accent);font-weight:400}
svg.bot{position:absolute;left:14px;right:14px;top:94px;width:calc(100% - 28px);height:168px}
.part.focus{filter:drop-shadow(0 0 6px rgba(255,230,41,.7))}
.st{fill:var(--bg2);stroke:var(--fg-structure);stroke-width:1.5}
.st2{fill:var(--plate);stroke:var(--fg-structure);stroke-width:1.5}
.focus .st,.focus .st2{stroke:var(--accent)}
.ground{stroke:var(--line);stroke-width:2;stroke-dasharray:6 4}
.plabel{font:9px var(--font-mono);letter-spacing:.16em;fill:var(--fg-structure);text-anchor:middle}
.focus .plabel{fill:var(--accent)}
.spoke{stroke:var(--fg-dim);stroke-width:2;stroke-linecap:round}
.focus .spoke{stroke:var(--accent)}
.ball{fill:var(--accent);opacity:0}
.tele{position:absolute;left:20px;right:28px;bottom:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px 22px}
.ro{white-space:nowrap;display:flex;align-items:baseline;gap:8px;font:11px var(--font-mono);letter-spacing:var(--track-wide);text-transform:uppercase;color:var(--fg-dim);transition:color .15s}
.ro .ld{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-.25em);min-width:20px}
.ro .v{flex:none;color:var(--fg);letter-spacing:0;font-variant-numeric:tabular-nums;font-size:14px}
.ro.hot{color:var(--fg)}
.ro.hot .v{color:var(--accent)}
.ro .lamp{align-self:center}
.hint{position:absolute;left:0;right:0;bottom:3px;text-align:center;font:10px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-structure)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.ring.go,.ra.pop,.call.flash rect.cb{animation:none}}
</style>

    let x,y=c.y-H/2,path;
    if(c.side==="L"){x=12;path=`M${x+W} ${c.y} H${x+W+12} L${c.ax} ${c.ay}`;}
    else if(c.side==="R"){x=600-6-W;path=`M${x} ${c.y} H${x-12} L${c.ax} ${c.ay}`;}
    else {x=300-W/2;y=2;path=`M${c.ax} ${y+H} L${c.ax} ${c.ay-6}`;}
    const lead=el("path",{class:"lead",d:path},svg);
    const dot=el("circle",{class:"cdot",cx:c.ax,cy:c.ay,r:3},svg);
    const cg=el("g",{class:"call",transform:`translate(${x} ${y})`},svg);
    el("rect",{class:"cb",x:0,y:0,width:W,height:H,rx:3},cg);
    const R=c.side==="R", ax=R?W-9:9, ta=R?"end":"start";
    el("text",{class:"ck",x:ax,y:15,"text-anchor":ta},cg).textContent=c.k;
    const m=el("text",{class:"cm",x:R?9:W-9,y:15,"text-anchor":R?"start":"end"},cg);m.textContent=c.m;
    el("text",{class:"ct",x:ax,y:34,"text-anchor":ta},cg).textContent=c.t;
    dom[who].calls.push({c,lead,dot,cg,m});
    cg.addEventListener("pointerdown",e=>{e.preventDefault();cg.setPointerCapture(e.pointerId);
      if(G[c.keys[0]].stick){tapStick(who,c.keys[0]);return;} setMouse(who,c.keys[0],true);});
    const up=()=>{for(const kk of c.keys)setMouse(who,kk,false);};
    cg.addEventListener("pointerup",up);cg.addEventListener("pointercancel",up);
  }
  host.appendChild(svg);
  dom[who].svg=svg;
  for(const k in binds){
    const o=dom[who][k]; if(!o) continue;
    const isStick=!!G[k].stick;
    o.g.addEventListener("pointerdown",e=>{
      e.preventDefault();o.g.setPointerCapture(e.pointerId);
      if(isStick){o.drag=true;o.maxd=0;o.announced=false;o.g.classList.add("drag");stickMove(who,k,e);}
      else setMouse(who,k,true);
    });
    o.g.addEventListener("pointermove",e=>{if(isStick&&o.drag)stickMove(who,k,e);});
    const end=()=>{
      if(isStick&&o.drag){o.drag=false;o.g.classList.remove("drag");if(o.maxd<0.15)tapStick(who,k);mouseAxes[who][k]={x:0,y:0};}
      else setMouse(who,k,false);
    };
    o.g.addEventListener("pointerup",end);o.g.addEventListener("pointercancel",end);
    o.g.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&!e.repeat){e.preventDefault();isStick?tapStick(who,k):setMouse(who,k,true);}});
    o.g.addEventListener("keyup",e=>{if((e.key==="Enter"||e.key===" ")&&!isStick)setMouse(who,k,false);});
  }
}
const Z=()=>({LS:{x:0,y:0},RS:{x:0,y:0}});
const mouse={driver:{},operator:{}}, padb={driver:{},operator:{}}, prev={driver:{},operator:{}};
const mouseAxes={driver:Z(),operator:Z()}, padAxes={driver:Z(),operator:Z()};
function setMouse(who,k,v){mouse[who][k]=v;}
function stickMove(who,k,e){
  const o=dom[who][k],svg=dom[who].svg,pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  let x=(p.x-OX-o.c[0])/24,y=(p.y-OY-o.c[1])/24;const L=Math.hypot(x,y);if(L>1){x/=L;y/=L;}
  o.maxd=Math.max(o.maxd,Math.hypot(x,y));mouseAxes[who][k]={x,y};
  if(o.maxd>=0.15&&!o.announced){o.announced=true;announce(who,k);}
}
function tapStick(who,k){if(!BIND[who][k])return;announce(who,k);S.demo[k==="LS"?"drive":"rotate"]=0.9;}

// ---------- robot model ----------
const S={};
function resetModel(){Object.assign(S,{elev:0,pivot:0,pivotT:0,roller:false,rollerA:0,idle:false,rpm:0,wheelA:0,feed:0,spinA:0,ballP:0,aim:false,tur:0,aimT:0,slow:false,hdg:0,gyroFlash:0,wheelsA:0,demo:{drive:0,rotate:0},focus:{}});}
resetModel();
const FXPART={gyro:"p-drive",drive:"p-drive",rotate:"p-drive",slow:"p-drive",roller:"p-intake",pivot:"p-intake",jogU:"p-intake",jogD:"p-intake",climbUp:"p-elev",climbDown:"p-elev",idle:"p-shooter",spin:"p-shooter",feed:"p-feed",unjam:"p-feed",aim:"p-turret",turL:"p-turret",turR:"p-turret"};
const FXTELE={gyro:"t-drive",drive:"t-drive",rotate:"t-drive",slow:"t-slow",roller:"t-intake",pivot:"t-intake",jogU:"t-intake",jogD:"t-intake",climbUp:"t-climb",climbDown:"t-climb",idle:"t-idle",spin:"t-shooter",feed:"t-shooter",unjam:"t-shooter",aim:"t-aim",turL:"t-turret",turR:"t-turret"};
const $=id=>document.getElementById(id);
const ra=$("ra"), rs=$("rs");
function announce(who,k){
  const b=BIND[who][k]; if(!b) return;
  ra.textContent=b.t; ra.classList.remove("pop","idle"); void ra.offsetWidth; ra.classList.add("pop");
  rs.innerHTML=`${who==="driver"?"Driver · slot 0":"Operator · slot 1"} · <b>${b.n}</b> · ${b.m==="STICK"?"stick":b.m.toLowerCase()}`;
  const o=dom[who][k]; o.ring.classList.remove("go"); void o.ring.getBBox(); o.ring.classList.add("go");
  for(const c of dom[who].calls) if(c.c.keys.includes(k)){c.cg.classList.remove("flash");void c.cg.getBBox();c.cg.classList.add("flash");}
  S.focus[FXPART[b.fx]]=1.0; S.focus[FXTELE[b.fx]]=1.0;
}
function onPress(who,k){
  const b=BIND[who][k]; if(!b) return;
  announce(who,k);
  switch(b.fx){
    case "gyro": S.hdg=0; S.gyroFlash=1; break;
    case "pivot": S.pivotT = S.pivotT>0.5?0:1; break;
    case "idle": S.idle=!S.idle; break;
    case "aim": S.aim=!S.aim; S.aimT=0; break;
  }
  if(b.m==="TOGGLE") rs.innerHTML+=` · now <b>${toggleState(who,k)}</b>`;
}
function toggleState(who,k){const fx=BIND[who][k].fx;if(fx==="pivot")return S.pivotT>0.5?"DOWN":"UP";if(fx==="idle")return S.idle?"ON":"OFF";if(fx==="aim")return S.aim?"ON":"OFF";return"";}
const held=(who,k)=>!!(mouse[who][k]||padb[who][k]);

// ---------- controller input ----------
// LOCAL mode: served by the 5669 Controller Map launcher on this laptop. It reads the
// controllers through Windows XInput, which works no matter which window has focus,
// so Driver Station can stay selected while the map follows every press.
// Otherwise: the browser Gamepad API (only while this window is focused).
const LOCAL = /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
let swapPads=false, xi=[], mm=[], xiOk=false, xiFails=0, useSrc="mm", lastXiHit=0, lastMmHit=0;
const XB={DU:0x1,DD:0x2,DL:0x4,DR:0x8,START:0x10,BACK:0x20,LSB:0x40,RSB:0x80,LB:0x100,RB:0x200,A:0x1000,B:0x2000,X:0x4000,Y:0x8000};
async function xinputLoop(){
  for(;;){
    try{const r=await fetch("/state",{cache:"no-store"});const j=await r.json();
      if(Array.isArray(j)){xi=j;mm=[];}else{xi=j.xi||[];mm=j.mm||[];}
      xiOk=true;xiFails=0;fetches++;}
    catch(e){xiFails++;if(xiFails>10)xiOk=false;}
    await new Promise(r=>setTimeout(r,25));
  }
}
if(LOCAL) xinputLoop();
const IDX={A:0,B:1,X:2,Y:3,LB:4,RB:5,LT:6,RT:7,BACK:8,START:9,LSB:10,RSB:11,DU:12,DD:13,DL:14,DR:15};
const dz=v=>Math.abs(v)<0.1?0:v;
let ticks=0,tps=0,lastT=performance.now(),fetches=0,fps=0;
function readPads(){
  let pads=[], src="Click mode";
  if(LOCAL&&xiOk){
    const now=performance.now();
    const xiPads=xi.filter(Boolean).map(p=>{
      const b={};for(const k in XB)b[k]=!!(p.b&XB[k]);b.LT=p.lt>127;b.RT=p.rt>127;
      return {name:"Pad "+(p.i+1),b,LS:{x:dz(p.lx/32767),y:dz(-p.ly/32767)},RS:{x:dz(p.rx/32767),y:dz(-p.ry/32767)},hit:p.b||p.lt>40||p.rt>40||Math.abs(p.lx)>9000||Math.abs(p.ly)>9000};
    });
    // Joystick API: Xbox layout 1 A, 2 B, 3 X, 4 Y, 5 LB, 6 RB, 7 Back, 8 Start, 9 LS, 10 RS; POV = D-pad; Z = both triggers.
    const n=v=>(v-32767)/32768;
    const mmPads=mm.map(p=>{
      const bb=p.b,b={A:!!(bb&1),B:!!(bb&2),X:!!(bb&4),Y:!!(bb&8),LB:!!(bb&16),RB:!!(bb&32),BACK:!!(bb&64),START:!!(bb&128),LSB:!!(bb&256),RSB:!!(bb&512)};
      const pv=p.pov; const on=pv!==65535&&pv>=0&&pv<36000;
      b.DU=on&&(pv>=31500||pv<=4500);b.DR=on&&pv>=4500&&pv<=13500;b.DD=on&&pv>=13500&&pv<=22500;b.DL=on&&pv>=22500&&pv<=31500;
      const z=n(p.z);b.LT=z>0.5;b.RT=z<-0.5;
      return {name:"Joy "+(p.i+1),b,LS:{x:dz(n(p.x)),y:dz(n(p.y))},RS:{x:dz(n(p.u)),y:dz(n(p.r))},hit:bb||on||Math.abs(z)>0.3};
    });
    if(xiPads.some(p=>p.hit))lastXiHit=now;
    if(mmPads.some(p=>p.hit))lastMmHit=now;
    useSrc = lastXiHit>lastMmHit ? "xi" : (mmPads.length?"mm":"xi");
    pads = useSrc==="xi"?xiPads:mmPads;
    src = (useSrc==="xi"?"XInput":"Joystick")+" live";
  } else {
    const list=(navigator.getGamepads?[...navigator.getGamepads()]:[]).filter(Boolean);
    if(list.length)src="Browser pads";
    pads=list.map(gp=>{const b={};for(const k in IDX){const x=gp.buttons[IDX[k]];if(x)b[k]=x.pressed||x.value>0.5;}
      return {name:"Pad "+(gp.index+1),b,LS:{x:dz(gp.axes[0]||0),y:dz(gp.axes[1]||0)},RS:{x:dz(gp.axes[2]||0),y:dz(gp.axes[3]||0)}};});
  }
  if(swapPads)pads.reverse();
  $("src-name").textContent=src;
  $("src-lamp").className="lamp"+(src.endsWith("live")?" ok":src==="Browser pads"?" on":"");
  ["driver","operator"].forEach((who,i)=>{
    const p=pads[i], lamp=$("lamp-"+who), nm=$("pad-"+who+"-name");
    if(!p){lamp.className="lamp";nm.textContent="No pad";padb[who]={};padAxes[who]=Z();return;}
    lamp.className="lamp ok";nm.textContent=p.name+" live";
    padb[who]=p.b;padAxes[who]={LS:p.LS,RS:p.RS};
    for(const s of ["LS","RS"]){const a=p[s],o=dom[who][s];const m=Math.hypot(a.x,a.y);
      if(m>0.35&&!o.padAnn&&BIND[who][s]){o.padAnn=true;announce(who,s);} if(m<0.1)o.padAnn=false;}
  });
}

// ---------- frame loop ----------
const carriage=$("carriage"),arm=$("arm"),roller=$("roller"),wheel=$("wheel"),spindex=$("spindex"),balls=[...document.querySelectorAll(".ball")];
function axisOf(who,k){const p=padAxes[who][k]||{x:0,y:0},m=mouseAxes[who][k]||{x:0,y:0};const a=Math.hypot(p.x,p.y)>Math.hypot(m.x,m.y)?p:m;return{x:a.x,y:a.y,m:Math.hypot(a.x,a.y)};}
let last=performance.now();
function step(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  readPads();
  for(const who of ["driver","operator"]){
    for(const k in BIND[who]){
      if(G[k].stick) continue;
      const h=held(who,k);
      if(h&&!prev[who][k]) onPress(who,k);
      prev[who][k]=h;
      dom[who][k].g.classList.toggle("down",h);
    }
    for(const c of dom[who].calls){
      const on=c.c.keys.some(k=>G[k].stick?axisOf(who,k).m>0.1:held(who,k));
      c.cg.classList.toggle("on",on);c.lead.classList.toggle("on",on);c.dot.classList.toggle("on",on);
      if(c.c.m==="TOGGLE"){const st=toggleState(who,c.c.keys[0]);if(c.m.textContent!==st)c.m.textContent=st;
        dom[who][c.c.keys[0]].g.classList.toggle("lit",st==="DOWN"||st==="ON");}
    }
    for(const s of ["LS","RS"]){const a=axisOf(who,s),o=dom[who][s];o.knob.setAttribute("transform",`translate(${a.x*9} ${a.y*9})`);o.g.classList.toggle("moving",a.m>0.1&&!!BIND[who][s]);}
  }
  const D="driver",O="operator";
  if(held(D,"DU"))S.elev=Math.min(1,S.elev+dt*0.45);
  if(held(D,"DD"))S.elev=Math.max(0,S.elev-dt*0.45);
  if(held(D,"DU")||held(D,"DD"))S.focus["p-elev"]=S.focus["t-climb"]=1;
  if(held(O,"DU")){S.pivot=Math.max(0,S.pivot-dt*0.35);S.pivotT=S.pivot;S.focus["p-intake"]=S.focus["t-intake"]=1;}
  if(held(O,"DD")){S.pivot=Math.min(1,S.pivot+dt*0.35);S.pivotT=S.pivot;S.focus["p-intake"]=S.focus["t-intake"]=1;}
  S.pivot+=Math.sign(S.pivotT-S.pivot)*Math.min(Math.abs(S.pivotT-S.pivot),dt*2.2);
  S.roller=held(D,"RT"); if(S.roller){S.rollerA+=dt*900;S.focus["p-intake"]=S.focus["t-intake"]=1;}
  const spin=held(O,"LT"), target=spin?3100:(S.idle?2000:0);
  S.rpm+=Math.sign(target-S.rpm)*Math.min(Math.abs(target-S.rpm),dt*(target>S.rpm?2600:1400));
  S.wheelA+=S.rpm*dt*0.25; if(spin)S.focus["p-shooter"]=S.focus["t-shooter"]=1;
  const feed=held(O,"RT"), unjam=held(O,"B");
  S.feed=feed?1:(unjam?-1:0);
  if(S.feed){S.spinA+=S.feed*dt*300;S.ballP+=S.feed*dt*0.9;S.focus["p-feed"]=1;}
  if(held(O,"DL")||held(O,"DR")){S.aim=false;S.tur=Math.max(-180,Math.min(180,S.tur+(held(O,"DR")?1:-1)*dt*90));S.focus["p-turret"]=S.focus["t-turret"]=1;}
  else if(S.aim){S.aimT+=dt;S.tur+= (Math.sin(S.aimT*1.4)*70-S.tur)*Math.min(1,dt*3);}
  S.slow=held(D,"START");
  const ls=axisOf(D,"LS"),rsx=axisOf(D,"RS");
  let vx=ls.x,vy=ls.y,w=rsx.x;
  if(S.demo.drive>0){S.demo.drive-=dt;vy=-0.85*Math.sin(Math.PI*Math.max(0,S.demo.drive)/0.9);}
  if(S.demo.rotate>0){S.demo.rotate-=dt;w=0.9;}
  const cube=v=>v*v*v, sc=S.slow?0.35:1;
  vx=cube(vx)*sc;vy=cube(vy)*sc;w=cube(w)*sc;
  S.hdg=((S.hdg+w*dt*220)%360+360)%360;
  S.wheelsA+=(Math.hypot(vx,vy)+Math.abs(w))*dt*600;
  if(Math.hypot(vx,vy)+Math.abs(w)>0.02)S.focus["p-drive"]=S.focus["t-drive"]=1;
  if(S.slow)S.focus["p-drive"]=S.focus["t-slow"]=1;
  S.gyroFlash=Math.max(0,S.gyroFlash-dt*1.5);
  // draw
  carriage.setAttribute("transform",`translate(0 ${-S.elev*100})`);
  arm.setAttribute("transform",`rotate(${-110+S.pivot*138} 296 144)`);
  roller.setAttribute("transform",`rotate(${S.rollerA} 352 144)`);
  wheel.setAttribute("transform",`rotate(${S.wheelA} 178 42)`);
  spindex.setAttribute("transform",`rotate(${S.spinA} 178 123)`);
  $("w1").setAttribute("transform",`rotate(${S.wheelsA} 96 174)`);$("w2").setAttribute("transform",`rotate(${S.wheelsA} 272 174)`);
  balls.forEach((b,i)=>{
    if(!S.feed){b.style.opacity=0;return;}
    const p=((S.ballP+i/3)%1+1)%1; let x,y;
    if(S.feed>0){ if(p<0.55){const q=p/0.55;x=178;y=123-q*81;} else {const q=(p-0.55)/0.45;x=178+q*170;y=42-Math.sin(q*Math.PI*0.9)*36+q*8;} }
    else { x=178+Math.cos(p*Math.PI*2)*13; y=123+Math.sin(p*Math.PI*2)*13; }
    b.setAttribute("cx",x);b.setAttribute("cy",y);b.style.opacity=1;
  });
  $("rpm").textContent=Math.round(S.rpm);
  $("l-idle").classList.toggle("on",S.idle);$("v-idle").textContent=S.idle?"On":"Off";
  $("l-aim").classList.toggle("on",S.aim);$("v-aim").textContent=S.aim?"On":"Off";
  $("l-slow").classList.toggle("on",S.slow);$("v-slow").textContent=S.slow?"Slow":"Full";
  $("l-roller").classList.toggle("on",S.roller);
  $("tdeg").textContent=Math.round(S.tur);
  $("hdg").textContent=Math.round(S.hdg);
  $("t-drive").style.opacity=S.gyroFlash>0?(0.4+0.6*Math.abs(Math.cos(S.gyroFlash*12))):1;
  $("istate").textContent=S.pivot>0.95?"Down":S.pivot<0.05?"Up":Math.round(S.pivot*100)+"%";
  $("climbpct").textContent=Math.round(S.elev*100)+"%";
  for(const id in S.focus){S.focus[id]-=dt;const e=$(id);if(!e)continue;const on=S.focus[id]>0;
    if(id.startsWith("t-"))e.classList.toggle("hot",on);else e.classList.toggle("focus",on);}
}
// requestAnimationFrame pauses when the window is not painted; a timer keeps the map
// following the controllers while Driver Station has focus.
let rafPending=false;
function tick(){try{step(performance.now());}catch(e){$("diag").textContent="error: "+e.message;console.error(e);return;}ticks++;const n=performance.now();if(n-lastT>=1000){tps=ticks;fps=fetches;ticks=0;fetches=0;lastT=n;
  const raw=(LOCAL&&xiOk)?("XI "+(xi.filter(Boolean).map(p=>p.b.toString(16)+(p.lt>127?"L":"")+(p.rt>127?"R":"")).join(",")||"-")+" · JOY "+(mm.map(p=>p.b.toString(16)+(p.pov!==65535?"^":"")).join(",")||"-")):"local off";
  $("diag").textContent=tps+"/s · "+(LOCAL?fps+" reads/s · ":"")+raw;}}
setInterval(tick,33);

// ---------- fit ----------
function fit(){
  const vw=innerWidth,vh=innerHeight,stage=$("stage"),vp=$("viewport");
  const stack=vw<1000&&vw/vh<1.25;
  document.body.classList.toggle("stack",stack);
  if(stack){const s=vw/624;stage.style.transform=`scale(${s})`;stage.style.left="0px";stage.style.top="0px";vp.style.height=(stage.scrollHeight*s)+"px";}
  else{const s=Math.min(vw/1600,vh/470);stage.style.transform=`scale(${s})`;stage.style.left=((vw-1600*s)/2)+"px";stage.style.top=Math.max(0,(vh-470*s)/2)+"px";vp.style.height=vh+"px";}
}
buildPad("driver");buildPad("operator");
addEventListener("resize",fit);fit();
$("swap").onclick=()=>{swapPads=!swapPads;};
$("reset").onclick=()=>{resetModel();ra.textContent="Ready";ra.classList.add("idle");rs.textContent="Press any button";};
</script>
</body>
